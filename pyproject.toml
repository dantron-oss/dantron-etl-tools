[project]
name = "dantron-etl-tools"
# The version is written once, as __version__ in src/dantron_etl/__init__.py (see [tool.hatch.version]).
dynamic = ["version"]
description = "Data pipelines written as YAML files, built from a fixed set of tools, with every step's rows open to inspection."
requires-python = ">=3.13"
readme = "README.md"
authors = [{ name = "DanTron Inc" }]
keywords = ["etl", "data pipeline", "yaml", "polars", "data transformation", "data lineage", "excel"]
# No licence classifier yet: the licence is still to be chosen.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

# polars is the engine. xlsxwriter and fastexcel are needed when the package loads, because every
# tool registers itself on import. openpyxl and PyYAML are imported only where they are used.
dependencies = [
    # 1.38 is the lowest version tested. Below 2 because polars 2 stopped casting text to a date,
    # which cast_columns relies on. Moving to 2 is a change to make on purpose.
    "polars>=1.38,<2",
    "xlsxwriter>=3.2.0",
    "fastexcel>=0.21.0",
    # write_excel fills a template workbook without flattening it, which needs openpyxl.
    "openpyxl>=3.1.0",
    "PyYAML>=6.0.0",
]

# Database drivers are an extra. The table tools import a driver only when a step uses one, and
# name the package to install when it is missing. SQLite needs nothing.
[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.0",
    "adbc-driver-postgresql>=1.0.0",
]
# ruff is pinned exactly because lint is the gate and a new ruff brings new default rules.
# Raise the pin on purpose, and fix what the new version finds in the same change.
dev = [
    "pytest>=8.0.0",
    "ruff==0.14.0",
]

[project.scripts]
dantron-etl = "dantron_etl.cli:main"

[project.urls]
Homepage = "https://github.com/DanTron-Inc/dantron-etl-tools"
Documentation = "https://github.com/DanTron-Inc/dantron-etl-tools/tree/develop/docs"
Source = "https://github.com/DanTron-Inc/dantron-etl-tools"
Issues = "https://github.com/DanTron-Inc/dantron-etl-tools/issues"
Changelog = "https://github.com/DanTron-Inc/dantron-etl-tools/blob/develop/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dantron_etl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dantron_etl"]

# The source package lists what goes in, so nothing else lying in a checkout (a .env, a key, a
# client's CSV) can ship. The exclude list catches a secret inside one of these folders too.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "pipelines/fixture.yaml",
    "pipelines/fixture",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "pyproject.toml",
    "uv.lock",
    "Makefile",
    "compose.yaml",
]
exclude = [
    ".env",
    ".env.*",
    "*.pem",
    "*.key",
    "*.p12",
    "*.pfx",
    "id_rsa*",
    "id_ecdsa*",
    "id_ed25519*",
    ".netrc",
    ".pypirc",
    "*.parquet",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
# This checkout's own source, ahead of whatever an editable install points at, so a worktree tests
# its own code and not the main checkout's.
pythonpath = ["src"]
# `postgres` is added by tests/conftest.py to every test that reaches the test server.
markers = [
    "slow: takes seconds on its own; leave out with -m 'not slow'",
    "postgres: needs the test Postgres named by DANTRON_TEST_POSTGRES; skips without it",
]
addopts = "--strict-markers"
