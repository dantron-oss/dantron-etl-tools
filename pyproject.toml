[project]
name = "dantron-etl-tools"
version = "0.1.0"
description = "Generic, configurable data transformation tools: a pipeline is a data file, and a run leaves evidence."
requires-python = ">=3.13"
readme = "README.md"

# Declared from measurement, not from habit. polars is the library. xlsxwriter and fastexcel are
# here because `read_excel` and `write_excel` import them at module level, and importing this
# package registers every tool -- so without them `import dantron_etl` itself fails, which is a
# worse error than a missing feature. openpyxl and PyYAML are imported inside the one function that
# needs each, so they would fail later and more precisely; they are declared anyway because writing
# a workbook and loading a pipeline file are what most consumers came for.
dependencies = [
    # 1.38 is the verified floor, not the theoretical one: the join parameters these tools rely on
    # (nulls_equal, maintain_order) arrived well after 1.0, and nulls_equal was spelled join_nulls
    # before that. A floor we have run beats a lower one we have only reasoned about.
    # The ceiling is there for the same reason. Polars 2.0 stopped casting text to a date, which
    # cast_columns relies on, so a fresh install picked up 2.x and failed 40 tests. Moving to 2.x is
    # its own change to the library, made on purpose, not something an install does by accident.
    "polars>=1.38,<2",
    "xlsxwriter>=3.2.0",
    "fastexcel>=0.21.0",
    # Writing a workbook without flattening it: openpyxl loads an existing file and saves it back,
    # which xlsxwriter cannot do, and which is the whole promise of write_workbook.
    "openpyxl>=3.1.0",
    "PyYAML>=6.0.0",
]

# No database driver in the core set, deliberately. A driver is the heavy, platform-specific
# dependency, and a project using these tools for files and frames should not be made to build one.
# `read_table` and `write_table` import theirs lazily by URI scheme and name the package to install
# when it is missing; SQLite needs nothing at all, which is what lets every worked example in the
# catalog execute with no server.
[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.0",
    "adbc-driver-postgresql>=1.0.0",
]
# ruff is pinned exactly because lint is the gate. No rule set is chosen in [tool.ruff], so each
# new ruff release brings new default rules: 0.17 reported 147 findings on code that 0.14 passes.
# Raise the pin on purpose, and fix what the new version finds in the same change.
# orjson is used by the tests and the page builders in scripts/, never by the library itself.
dev = [
    "pytest>=8.0.0",
    "ruff==0.14.0",
    "orjson>=3.10.0",
]

[project.scripts]
dantron-etl = "dantron_etl.cli:main"

[project.urls]
Source = "https://github.com/DanTron-Inc/dantron-etl-tools"
Issues = "https://github.com/DanTron-Inc/dantron-etl-tools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dantron_etl"]

# The source package lists what goes in, rather than taking the working tree minus .gitignore.
# Otherwise anything lying in a checkout -- a .env, a key, a client's CSV under pipelines/ -- ships
# to everyone who downloads it. The exclude list catches a secret inside one of these folders too.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "scripts",
    "pipelines/fixture.yaml",
    "pipelines/fixture",
    "README.md",
    "pyproject.toml",
    "uv.lock",
    "Makefile",
    "compose.yaml",
]
exclude = [
    ".env",
    ".env.*",
    "*.pem",
    "*.key",
    "*.p12",
    "*.pfx",
    "id_rsa*",
    "id_ecdsa*",
    "id_ed25519*",
    ".netrc",
    ".pypirc",
    "*.parquet",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
# This checkout's own source, ahead of whatever an editable install points at. Without it a run
# inside a worktree imports the *main* checkout's package -- the tests pass or fail against code
# nobody is editing, which is the one failure mode a test run cannot report.
# The checkout's root is there too, so the page-builder tests can import `scripts`.
pythonpath = ["src", "."]
# `postgres` is added by tests/conftest.py to every test that reaches the test server.
markers = [
    "slow: takes seconds on its own; leave out with -m 'not slow'",
    "postgres: needs the test Postgres named by DANTRON_TEST_POSTGRES; skips without it",
]
addopts = "--strict-markers"
