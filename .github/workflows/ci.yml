# Lint, and the whole test suite on Linux and on Windows, for every push and pull request.
#
# Linux runs everything, including the tests that need Postgres, against a throwaway server the same
# as the one in compose.yaml. Windows runs everything else: GitHub's Windows machines cannot start a
# database container. It still installs the Postgres drivers, because a consumer on Windows will.
#
# `--locked` refuses to run if uv.lock no longer matches pyproject.toml, so a version change that
# was not locked fails here instead of on somebody's fresh checkout.

name: CI

on:
  push:
    branches: [develop, main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests

  test-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: etl_test
          POSTGRES_PASSWORD: etl_test
          POSTGRES_DB: etl_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U etl_test -d etl_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DANTRON_TEST_POSTGRES: postgresql://etl_test:etl_test@localhost:5434/etl_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra postgres
      - run: uv run --no-sync pytest tests/ -q -rs

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra postgres
      - run: uv run --no-sync pytest tests/ -q

  # What a user installs: the wheel, in a fresh environment with no dev extras, driven only through
  # the command. Catches a page template or launcher missing from the wheel, or a module that
  # imports something only the dev extras provide.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel --out-dir dist
      - run: uv venv /tmp/user-env
      - run: uv pip install --python /tmp/user-env/bin/python dist/*.whl
      - name: the command works on a new project
        working-directory: /tmp
        run: |
          /tmp/user-env/bin/dantron-etl --version
          /tmp/user-env/bin/dantron-etl new demo
          cd demo
          /tmp/user-env/bin/dantron-etl check pipelines/example.yaml
          /tmp/user-env/bin/dantron-etl run example
          /tmp/user-env/bin/dantron-etl help join > /dev/null
          /tmp/user-env/bin/python -c "import importlib.resources as r; assert r.files('dantron_etl').joinpath('MANUAL.md').is_file()"
