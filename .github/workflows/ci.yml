# For every push and pull request: lint, the whole test suite on Linux and Windows, and the package
# a user would install, built and tried from a clean environment.
#
# Linux runs the tests that need Postgres against a throwaway server, like the one in compose.yaml.
# Windows runs the rest: GitHub's Windows machines cannot start a database container.
#
# `--locked` stops the run if uv.lock no longer matches pyproject.toml.
#
# The client-word check runs only when the repository secret ETL_FORBIDDEN_TERMS holds the words
# (comma-separated). Without it, that one test is skipped. See CONTRIBUTING.md.

name: CI

on:
  push:
    branches: [develop, main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests docs/_build

  test-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: etl_test
          POSTGRES_PASSWORD: etl_test
          POSTGRES_DB: etl_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U etl_test -d etl_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DANTRON_TEST_POSTGRES: postgresql://etl_test:etl_test@localhost:5434/etl_test
      ETL_FORBIDDEN_TERMS: ${{ secrets.ETL_FORBIDDEN_TERMS }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra postgres
      - run: uv run --no-sync pytest tests/ -q -rs

  # The oldest Pythons the package supports. The jobs above use .python-version, the newest.
  test-older-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync python --version
      - run: uv run --no-sync pytest tests/ -q

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra postgres
      - run: uv run --no-sync pytest tests/ -q

  # What a user installs: the wheel and the source package are built, then the wheel goes into a
  # fresh environment with no dev extras and is driven only through the command. This catches a
  # template or launcher missing from the wheel, or a module importing something only dev provides.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir dist
      - run: ls dist
      - run: uv venv "$RUNNER_TEMP/user-env"
      - run: uv pip install --python "$RUNNER_TEMP/user-env" dist/*.whl
      - name: the command works on a new project
        working-directory: ${{ runner.temp }}
        run: |
          source user-env/bin/activate 2>/dev/null || source user-env/Scripts/activate
          dantron-etl --version
          dantron-etl new demo
          cd demo
          dantron-etl check pipelines/example.yaml
          dantron-etl run example
          dantron-etl tools > /dev/null
          dantron-etl help join > /dev/null
          python -c "import importlib.resources as r; assert r.files('dantron_etl').joinpath('MANUAL.md').is_file()"
          python -c "import importlib.resources as r; assert r.files('dantron_etl').joinpath('py.typed').is_file()"
